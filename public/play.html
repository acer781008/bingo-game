<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多人打地鼠｜玩家</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar"><div><strong>🐹 多人打地鼠</strong><span id="conn" class="pill">連線中...</span></div></header>
  <main class="player-wrap">
    <section id="joinCard" class="card join-card">
      <h2>加入遊戲</h2>
      <label>場次號碼<input id="roomId" maxlength="30" placeholder="例如：001" /></label>
      <label>玩家名稱<input id="playerName" maxlength="24" placeholder="輸入你的名字" /></label>
      <button id="joinBtn" class="btn primary wide">進入遊戲</button>
    </section>

    <section id="gameArea" class="hidden">
      <section class="card info-card">
        <div class="stats player-stats">
          <div><span>場次</span><strong id="sessionText">-</strong></div>
          <div><span>我的分數</span><strong id="scoreText">0</strong></div>
          <div><span>目前排名</span><strong id="rankText">-</strong></div>
          <div><span>剩餘時間</span><strong id="timeText">--:--</strong></div>
        </div>
        <p id="statusText" class="status-line">等待主控開始</p>
        <p id="noteText" class="note"></p>
      </section>

      <section class="card game-card">
        <div id="countdown" class="big-countdown hidden">5</div>
        <div id="moleGrid" class="mole-grid"></div>
      </section>

      <section class="card">
        <h2>🏆 即時連線排行</h2>
        <div id="ranking" class="ranking"></div>
      </section>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/play.js"></script>
</body>
</html>
