<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字賓果主控室</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #1f144d, #4c1d95, #0f5fa8);
            color: white;
            padding: 25px;
        }

        .wrap {
            max-width: 900px;
            margin: auto;
        }

        .panel {
            background: rgba(18, 13, 55, 0.94);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }

        .section {
            background: rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 17px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .create {
            background: #ffd43b;
            color: #241052;
        }

        .start {
            background: #30d158;
            color: white;
        }

        .draw {
            background: #0a84ff;
            color: white;
        }

        .auto {
            background: #bf5af2;
            color: white;
        }

        .pause {
            background: #ff9f0a;
            color: white;
        }

        .reset {
            background: #ff453a;
            color: white;
        }

        .back {
            background: #666;
            color: white;
        }

        .status {
            font-size: 18px;
            line-height: 1.8;
        }

        .number {
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            color: #ffd43b;
        }
    </style>
</head>

<body>

<div class="wrap">

    <div class="panel">

        <h1>👑 數字賓果主控室</h1>

        <div class="subtitle">
            建立房間・設定格數・控制開獎
        </div>

        <div class="section">

            <label>房間號碼</label>

            <input
                id="room"
                type="text"
                placeholder="例如：8888"
            >

            <label>遊戲格數</label>

            <select id="size">
                <option value="25">5×5</option>
<option value="36">6×6</option>
<option value="49">7×7</option>
<option value="64">8×8</option>
            </select>

          <button class="create" onclick="createRoom()">
    🏠 建立遊戲房間
</button>
<button type="button" onclick="copyPlayerLink()">
    🔗 複製玩家網址
</button>
<div id="startCountdown" style="margin-top:12px; font-size:22px; font-weight:bold;">
    等待分享玩家網址
</div>
        <div id="roomStatus">房間狀態：尚未建立</div>
<div id="sizeStatus">遊戲格數：尚未設定</div>
<div id="playerStatus">目前玩家：0 人</div>

        

        </div>

        <div class="section">
    <h2>🎱 目前開獎號碼</h2>

    <div class="number" id="adminCurrentNumber">
        -
    </div>
</div>

<div class="section">
    <h2>🏆 即時排行榜</h2>
    <div id="rankingList">尚無排名資料</div>
</div>

        <div class="section">

<label>📅 遊戲開始時間</label>

<input
    type="datetime-local"
    id="gameStartTime"
>
            <button class="start" onclick="scheduleGameStart()">
    ⏰ 設定開始時間
</button>

<div>
  🎱 開獎間隔：
  <select id="autoSeconds">
    <option value="2">2秒</option>
    <option value="3" selected>3秒</option>
    <option value="5">5秒</option>
    <option value="10">10秒</option>
  </select>
</div>
<div style="margin-top:15px;">
    <div>
  ⏱ 遊戲時間：
  <select id="autoPauseSeconds">
    <option value="30">30秒</option>
    <option value="60" selected>60秒</option>
    <option value="90">90秒</option>
    <option value="120">120秒</option>
  </select>
</div>
            <button class="auto" onclick="startAutoDraw()">
                ⚡ 自動開獎
            </button>

            <button class="pause" onclick="pauseAutoDraw()">
                ⏸️ 暫停
            </button>

            <button class="reset">
    ♻️ 重置遊戲
</button>
<button type="button" onclick="copyRanking()">
    📋 複製排名
</button>
        </div>

        <button
            class="back"
            onclick="location.href='index.html'">
            ⬅️ 回玩家首頁
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on("connect", () => {
    const savedRoomId = localStorage.getItem("adminRoomId");

    if (savedRoomId) {
        socket.emit("watchRoom", {
            roomId: savedRoomId
        });
    }
});
const savedAdminRoomId = localStorage.getItem("adminRoomId");

if (savedAdminRoomId) {
    document.getElementById("room").value = savedAdminRoomId;
    restoreAdminRoom(savedAdminRoomId);
}

async function restoreAdminRoom(roomId) {
    try {
        const response = await fetch("/api/room/" + roomId);
        const data = await response.json();

        if (!response.ok || !data.success) {
            localStorage.removeItem("adminRoomId");
            return;
        }

        const room = data.room;

        socket.emit("watchRoom", {
            roomId: room.roomId
        });

        document.getElementById("room").value = room.roomId;

        const sizeSelect = document.getElementById("size");
        if (sizeSelect) {
            sizeSelect.value = room.size;
        }

        const playerStatus = document.getElementById("playerStatus");
        if (playerStatus) {
            playerStatus.innerText =
                "目前玩家：" + room.playerCount + " 人";
        }

        const roomStatus = document.getElementById("roomStatus");
        if (roomStatus) {
            roomStatus.innerText =
                "房間狀態：" +
                (room.started ? "遊戲進行中" : "已建立");
        }

        const sizeStatus = document.getElementById("sizeStatus");
        if (sizeStatus) {
            sizeStatus.innerText =
                "遊戲格數：" + room.size + " 格";
        }

        if (room.scheduledStartAt && !room.started) {
            const startTime = new Date(Number(room.scheduledStartAt));
            const countdown = document.getElementById("startCountdown");

            if (startCountdownTimer) {
                clearInterval(startCountdownTimer);
            }

            function restoreCountdown() {
                const remaining = startTime.getTime() - Date.now();

                if (remaining <= 0) {
                    clearInterval(startCountdownTimer);
                    startCountdownTimer = null;

                    if (countdown) {
                        countdown.innerText = "▶ 遊戲開始！";
                    }

                    return;
                }

                const totalSeconds = Math.ceil(remaining / 1000);

                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                if (countdown) {
                    countdown.innerText =
                        "🕐 遊戲開始時間：" +
                        startTime.toLocaleString("zh-TW") +
                        "\n⏳ 剩餘：" +
                        days + "天 " +
                        hours + "時 " +
                        minutes + "分 " +
                        seconds + "秒";
                }
            }

            restoreCountdown();

            startCountdownTimer =
                setInterval(restoreCountdown, 1000);
        }

    } catch (error) {
        console.error("恢復管理房間失敗", error);
    }
}
socket.on("gameStarted", () => {
    const countdown = document.getElementById("startCountdown");

    if (countdown) {
        countdown.innerText = "▶ 遊戲開始！";
    }
});

socket.on("numberDrawn", data => {
    const currentNumber = document.getElementById("adminCurrentNumber");

    if (currentNumber) {
        currentNumber.innerText = data.number;
    }
});

socket.on("gameEnded", () => {
    const countdown = document.getElementById("startCountdown");

    if (countdown) {
        countdown.innerText = "🏁 遊戲結束";
    }
});
async function createRoom() {
    const roomId = document.getElementById("room").value.trim();
    const size = Number(document.getElementById("size").value);

    if (!roomId) {
        alert("請輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/admin/create-room", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId,
                size: size
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        document.getElementById("roomStatus").innerText =
            "房間狀態：✅ 已建立 " + data.room.roomId;

        document.getElementById("sizeStatus").innerText =
            "遊戲格數：" + data.room.size + " 格";

        document.getElementById("playerStatus").innerText =
            "目前玩家：0 人";

localStorage.setItem("adminRoomId", roomId);

socket.emit("watchRoom", {
    roomId: roomId
});

        alert("✅ 房間建立成功！");

    } catch (error) {
        alert("❌ 無法連接伺服器");
    }
}
 async function startGame() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("請輸入房間號碼");
        return false;
    }

    try {
        const response = await fetch("/api/admin/start-game", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return false;
        }

        alert("▶ 遊戲開始！");
        return true;

    } catch (error) {
        alert("❌ 無法連接伺服器");
        return false;
    }
} 
async function drawNumber() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("請輸入房間號碼");
        return false;
    }

    try {
        const response = await fetch("/api/admin/draw-number", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId
            })
        });

        const data = await response.json();

        if (!data.success) {
            if (data.message === "所有號碼都已開完") {
                return false;
            }

            alert("❌ " + data.message);
            return false;
        }

        document.querySelector(".number").innerText = data.number;
        return true;

    } catch (error) {
        alert("❌ 無法連接伺服器");
        return false;
    }
}
async function updatePlayerCount() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) return;

    try {
        const response = await fetch("/api/room/" + roomId);

        if (!response.ok) return;

        const data = await response.json();

        if (data.success) {
            document.getElementById("playerStatus").innerText =
                "目前玩家：" + data.room.playerCount + " 人";
        }
    } catch (error) {
        console.log("讀取玩家人數失敗");
    }
}
let autoDrawTimer = null;
let autoPauseTimer = null;

function startAutoDraw() {
    const seconds = Number(
        document.getElementById("autoSeconds").value
    );

    const pauseSeconds = Number(
        document.getElementById("autoPauseSeconds").value
    );

    if (autoDrawTimer) {
        clearInterval(autoDrawTimer);
    }

    if (autoPauseTimer) {
        clearTimeout(autoPauseTimer);
    }

    drawNumber();

autoDrawTimer = setInterval(async () => {
    const success = await drawNumber();

    if (!success) {
        clearInterval(autoDrawTimer);
        autoDrawTimer = null;

        if (autoPauseTimer) {
            clearTimeout(autoPauseTimer);
            autoPauseTimer = null;
        }

        const roomId = document.getElementById("room").value.trim();
        socket.emit("gameEnded", { roomId: roomId });

        alert("🏁 所有號碼都已開完，遊戲結束！");
    }
}, seconds * 1000);

    autoPauseTimer = setTimeout(() => {
        if (autoDrawTimer) {
            clearInterval(autoDrawTimer);
            autoDrawTimer = null;
        }

        autoPauseTimer = null;
const roomId = document.getElementById("room").value.trim();
socket.emit("gameEnded", { roomId: roomId });
        alert("⏸ 已到設定時間，自動開獎已暫停");
    }, pauseSeconds * 1000);
}


function pauseAutoDraw() {
    if (autoDrawTimer) {
        clearInterval(autoDrawTimer);
        autoDrawTimer = null;
    }

    if (autoPauseTimer) {
        clearTimeout(autoPauseTimer);
        autoPauseTimer = null;
    }

    alert("⏸ 自動開獎已暫停");
}
function copyPlayerLink() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("⚠️ 請先輸入房間號碼並建立房間");
        return;
    }

    const playerUrl = window.location.origin + "/?room=" + encodeURIComponent(roomId);

    navigator.clipboard.writeText(playerUrl)
       .then(() => {
    alert("✅ 玩家網址已複製！\n\n" + playerUrl);
    
})
        .catch(() => {
            alert("❌ 網址複製失敗");
        });
}
async function copyRanking() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("⚠️ 請先輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/room/" + roomId);
        const data = await response.json();

        if (!data.success) {
            alert("❌ 讀取排名失敗");
            return;
        }

        const players = Object.values(data.room.players || {});

        players.sort((a, b) => {
    if ((b.bingoLines || 0) !== (a.bingoLines || 0)) {
        return (b.bingoLines || 0) - (a.bingoLines || 0);
    }

    return (b.hitCount || 0) - (a.hitCount || 0);
});

        let text = "🏆 賓果排名\n\n";

        players.forEach((player, index) => {
            text += (index + 1) + ". " + player.name +
        "｜已點 " + (player.hitCount || 0) + " 格" +
        "｜賓果 " + (player.bingoLines || 0) + " 線\n";
        });

        await navigator.clipboard.writeText(text);
        alert("✅ 排名已複製！");
    } catch (error) {
        alert("❌ 複製排名失敗");
    }
}
let startCountdownTimer = null;

async function scheduleGameStart() {
    const roomId = document.getElementById("room").value.trim();
    const startTimeValue = document.getElementById("gameStartTime").value;
    const countdown = document.getElementById("startCountdown");

    if (!roomId) {
        alert("⚠️ 請先輸入房間號碼");
        return;
    }

    if (!startTimeValue) {
        alert("⚠️ 請選擇遊戲開始時間");
        return;
    }

    const startTime = new Date(startTimeValue);

    if (startTime.getTime() <= Date.now()) {
        alert("⚠️ 開始時間必須晚於現在時間");
        return;
    }

    try {
        const response = await fetch("/api/admin/schedule-start", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId,
                startTime: startTime.getTime(),
                autoSeconds: Number(document.getElementById("autoSeconds").value),
                autoPauseSeconds: Number(document.getElementById("autoPauseSeconds").value)
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        alert("✅ 遊戲開始時間設定成功！");

        if (startCountdownTimer) {
            clearInterval(startCountdownTimer);
        }

        function updateCountdown() {
            const remaining = startTime.getTime() - Date.now();

            if (remaining <= 0) {
                if (startCountdownTimer) {
                    clearInterval(startCountdownTimer);
                    startCountdownTimer = null;
                }

                countdown.innerText = "▶ 遊戲開始！";
                return;
            }

            const totalSeconds = Math.ceil(remaining / 1000);

            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            countdown.innerText =
                "🕐 遊戲開始時間：" +
                startTime.toLocaleString("zh-TW") +
                "\n⏳ 剩餘：" +
                days + "天 " +
                hours + "時 " +
                minutes + "分 " +
                seconds + "秒";
        }

        updateCountdown();

        startCountdownTimer = setInterval(updateCountdown, 1000);

    } catch (error) {
        alert("❌ 無法設定遊戲開始時間");
    }
}
async function updateRanking() {
    const roomId = document.getElementById("room").value.trim();
    if (!roomId) return;

    try {
        const response = await fetch("/api/room/" + roomId);
        const data = await response.json();

        if (!data.success) return;

        const players = Object.values(data.room.players || {});

        players.sort((a, b) => {
            if ((b.bingoLines || 0) !== (a.bingoLines || 0)) {
                return (b.bingoLines || 0) - (a.bingoLines || 0);
            }
            return (b.hitCount || 0) - (a.hitCount || 0);
        });

        const rankingList = document.getElementById("rankingList");

        if (players.length === 0) {
            rankingList.innerText = "尚無排名資料";
            return;
        }

        rankingList.innerHTML = players.map((player, index) =>
            (index + 1) + ". " + player.name +
            "｜已點 " + (player.hitCount || 0) + " 格" +
            "｜賓果 " + (player.bingoLines || 0) + " 線"
        ).join("<br>");
    } catch (error) {
        console.log(error);
    }
}

setInterval(updateRanking, 1000);
setInterval(updatePlayerCount, 1000);
</script>
</body>
</html>
