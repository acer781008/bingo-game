</body><script>
async function createRoom() {
    const roomId = document.getElementById("room").value.trim();
    const size = Number(document.getElementById("size").value);

    if (!roomId) {
        alert("請輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/admin/create-room", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId,
                size: size
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        document.getElementById("roomStatus").innerText =
            "房間狀態：✅ 已建立 " + data.room.roomId;

        document.getElementById("sizeStatus").innerText =
            "遊戲格數：" + data.room.size + " 格";

        document.getElementById("playerStatus").innerText =
            "目前玩家：0 人";

        alert("✅ 房間建立成功！");
    } catch (error) {
        alert("❌ 無法連接伺服器");
    }
}async function startGame() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("請輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/admin/start-game", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        alert("▶ 遊戲開始！");
    } catch (error) {
        alert("❌ 無法連接伺服器");
    }
} async function drawNumber() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("請輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/admin/draw-number", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomId: roomId
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert("❌ " + data.message);
            return;
        }

        document.querySelector(".number").innerText = data.number;

    } catch (error) {
        alert("❌ 無法連接伺服器");
    }
}
async function updatePlayerCount() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) return;

    try {
        const response = await fetch("/api/room/" + roomId);

        if (!response.ok) return;

        const data = await response.json();

        if (data.success) {
            document.getElementById("playerStatus").innerText =
                "目前玩家：" + data.room.playerCount + " 人";
        }
    } catch (error) {
        console.log("讀取玩家人數失敗");
    }
}
let autoDrawTimer = null;
let autoPauseTimer = null;
function setAutoSeconds(seconds) {
function setGameSeconds(seconds) {
    document.getElementById("autoPauseSeconds").value = seconds;
    alert("✅ 遊戲時間已設定為 " + seconds + " 秒");
}
    document.getElementById("autoSeconds").value = seconds;
    alert("✅ 開獎間隔已設定為 " + seconds + " 秒");
}
function startAutoDraw() {
    const seconds = Number(
        document.getElementById("autoSeconds").value
    );

    const pauseSeconds = Number(
        document.getElementById("autoPauseSeconds").value
    );

    if (autoDrawTimer) {
        clearInterval(autoDrawTimer);
    }

    if (autoPauseTimer) {
        clearTimeout(autoPauseTimer);
    }

    drawNumber();

    autoDrawTimer = setInterval(() => {
        drawNumber();
    }, seconds * 1000);

    autoPauseTimer = setTimeout(() => {
        if (autoDrawTimer) {
            clearInterval(autoDrawTimer);
            autoDrawTimer = null;
        }

        autoPauseTimer = null;
        alert("⏸ 已到設定時間，自動開獎已暫停");
    }, pauseSeconds * 1000);
}


function pauseAutoDraw() {
    if (autoDrawTimer) {
        clearInterval(autoDrawTimer);
        autoDrawTimer = null;
    }

    if (autoPauseTimer) {
        clearTimeout(autoPauseTimer);
        autoPauseTimer = null;
    }

    alert("⏸ 自動開獎已暫停");
}
function copyPlayerLink() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("⚠️ 請先輸入房間號碼並建立房間");
        return;
    }

    const playerUrl = window.location.origin + "/?room=" + encodeURIComponent(roomId);

    navigator.clipboard.writeText(playerUrl)
       .then(() => {
    alert("✅ 玩家網址已複製！\n\n" + playerUrl);
    start90SecondCountdown();
})
        .catch(() => {
            alert("❌ 網址複製失敗");
        });
}
async function copyRanking() {
    const roomId = document.getElementById("room").value.trim();

    if (!roomId) {
        alert("⚠️ 請先輸入房間號碼");
        return;
    }

    try {
        const response = await fetch("/api/room/" + roomId);
        const data = await response.json();

        if (!data.success) {
            alert("❌ 讀取排名失敗");
            return;
        }

        const players = Object.values(data.room.players || {});

        players.sort((a, b) => {
    if ((b.bingoLines || 0) !== (a.bingoLines || 0)) {
        return (b.bingoLines || 0) - (a.bingoLines || 0);
    }

    return (b.hitCount || 0) - (a.hitCount || 0);
});

        let text = "🏆 賓果排名\n\n";

        players.forEach((player, index) => {
            text += (index + 1) + ". " + player.name +
        "｜已點 " + (player.hitCount || 0) + " 格" +
        "｜賓果 " + (player.bingoLines || 0) + " 線\n";
        });

        await navigator.clipboard.writeText(text);
        alert("✅ 排名已複製！");
    } catch (error) {
        alert("❌ 複製排名失敗");
    }
}
let startCountdownTimer = null;

function start90SecondCountdown() {
    let secondsLeft = 90;

    const countdown = document.getElementById("startCountdown");

    if (startCountdownTimer) {
        clearInterval(startCountdownTimer);
    }

    countdown.innerText = "遊戲將在 " + secondsLeft + " 秒後開始";

    startCountdownTimer = setInterval(() => {
        secondsLeft--;

        countdown.innerText = "遊戲將在 " + secondsLeft + " 秒後開始";

        if (secondsLeft <= 0) {
            clearInterval(startCountdownTimer);
            startCountdownTimer = null;

            countdown.innerText = "▶ 遊戲開始！";

            startGame();
        }
    }, 1000);
}
setInterval(updatePlayerCount, 1000); </script>
