<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多人打地鼠｜主控</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="loginView" class="home">
    <section class="card">
      <h2>🔐 管理員登入</h2>
      <p class="muted">輸入管理密碼後才能進入打地鼠主控台。</p>
      <form id="loginForm">
        <label>管理密碼
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="請輸入管理密碼" required />
        </label>
        <button class="btn primary wide" type="submit">登入控制台</button>
      </form>
      <p id="loginMsg" class="login-msg" aria-live="polite"></p>
    </section>
  </main>

  <div id="adminApp" class="hidden">
    <header class="topbar"><div><strong>🔨 多人打地鼠｜主控</strong><span><button id="logoutBtn" class="btn mini" type="button">登出</button> <span id="conn" class="pill">連線中...</span></span></div></header>
    <main class="layout">
      <section class="card">
        <h2>🎮 活動設定</h2>
        <label>場次號碼<input id="roomId" value="001" maxlength="30" /></label>
        <label>難度
          <select id="difficulty">
            <option value="easy">簡易版｜3×3</option>
            <option value="medium">中級版｜4×4</option>
            <option value="hard">困難版｜5×5</option>
          </select>
        </label>
        <label>遊戲時間
          <select id="durationSec">
            <option value="60" selected>60 秒</option>
            <option value="90">90 秒</option>
            <option value="120">120 秒</option>
          </select>
        </label>
        <label>地鼠速度
          <select id="moleIntervalMs">
            <option value="500">0.5 秒</option>
            <option value="1000" selected>1 秒</option>
            <option value="2000">2 秒</option>
            <option value="3000">3 秒</option>
            <option value="4000">4 秒</option>
            <option value="5000">5 秒</option>
          </select>
        </label>
        <label>開賽倒數
          <select id="countdownSec">
            <option value="30" selected>30 秒</option>
            <option value="60">60 秒</option>
            <option value="90">90 秒</option>
            <option value="120">120 秒</option>
          </select>
        </label>
        <label>開賽時間<input id="startAt" type="datetime-local" /></label>
        <label>備註<textarea id="note" rows="3" placeholder="例如：請提前 5 分鐘進入遊戲"></textarea></label>
        <div class="actions">
          <button id="saveBtn" class="btn primary">💾 儲存／預約開賽</button>
          <button id="startBtn" class="btn success">▶️ 立即開始</button>
          <button id="finishBtn" class="btn danger">⏹️ 結束遊戲</button>
          <button id="resetBtn" class="btn">🔄 重開一局</button>
        </div>
        <div class="actions">
          <button id="copyUrlBtn" class="btn">🔗 複製玩家網址</button>
          <button id="copyRankBtn" class="btn">📋 複製排行榜</button>
        </div>
        <div id="shareUrl" class="share"></div>
      </section>

      <section class="card status-card">
        <h2>📡 場次狀態</h2>
        <div class="stats">
          <div><span>場次</span><strong id="sessionText">001</strong></div>
          <div><span>狀態</span><strong id="statusText">等待中</strong></div>
          <div><span>連線</span><strong id="onlineText">0</strong></div>
          <div><span>剩餘</span><strong id="timeText">--:--</strong></div>
        </div>
        <p id="countdownText" class="countdown"></p>
        <p id="noteText" class="note"></p>
      </section>

      <section class="card full">
        <h2>🏆 連線排行榜</h2>
        <div id="ranking" class="ranking"><p class="muted">尚無玩家</p></div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
