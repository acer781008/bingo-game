<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>管理員登入</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft JhengHei", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #241052,
                #5421a8,
                #1769c2
            );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 450px;

            background: rgba(20, 15, 55, 0.94);

            padding: 40px 30px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 50px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 12px;

            margin-bottom: 15px;

            font-size: 18px;
        }

        button {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 12px;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .login {
            background: #ffd43b;
            color: #241052;
        }

        .back {
            background: #555;
            color: white;
        }

        .note {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>👑 管理員登入</h1>

    <div class="subtitle">
        數字賓果賓果・主控室
    </div>

    <input
        id="password"
        type="password"
        placeholder="請輸入管理員密碼"
    >

    <button class="login" onclick="adminLogin()">
        🔐 登入主控室
    </button>

    <button
        class="back"
        onclick="location.href='index.html'">
        ⬅️ 回玩家首頁
    </button>

    <div class="note">
        僅限管理員使用
    </div>

</div>

</body><script>
async function adminLogin() {
    const password = document.getElementById("password").value;

    if (!password) {
        alert("請輸入管理員密碼");
        return;
    }

    try {
        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "/admin.html";
        } else {
            alert("❌ 管理員密碼錯誤");
        }

    } catch (error) {
        alert("❌ 無法連接伺服器");
    }
}
</script>
</html>
