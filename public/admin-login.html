<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css?v=21"><title>管理員登入</title></head><body class="cute-theme admin-page"><div class="wrap"><div class="card login"><h1>👑 管理員登入</h1><input id="pw" type="password" placeholder="管理員密碼"><br><br><button onclick="go()">登入主控室</button></div></div><script>async function go(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})}),d=await r.json();d.success?location.href="/admin.html":alert("❌ "+d.message)}</script></body></html>
