<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/style.css?v=21.14.2-farm">
  <title>種菜賓果</title>
  <style>
    .player-head-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.player-head-row button{width:auto;min-width:150px}.meta-line{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:7px}.meta-chip{font-size:13px;font-weight:800;color:#775c68;background:#fff8fb;border:1px solid #f0d9e2;border-radius:999px;padding:5px 9px}.number img{width:min(150px,38vw);height:min(150px,38vw);object-fit:contain;display:block;margin:0 auto}.farm-tile-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none}.picture-cell.hit .farm-tile-image{opacity:.38;transform:scale(.94)}.current-farm-image{width:min(150px,38vw)!important;height:min(150px,38vw)!important;max-height:none!important;object-fit:contain!important;display:block;margin:0 auto}.copy-row{display:flex;justify-content:center;margin-top:10px}.copy-row button{width:min(360px,100%)}
    .result-modal{position:fixed;inset:0;background:rgba(73,50,61,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.result-modal.hidden{display:none}.result-box{width:min(420px,100%);background:#fff;border:2px solid #ffd0df;border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.2)}.result-box h2{margin:0 0 12px;color:#a23866}.result-big{font-size:24px;font-weight:900;line-height:1.7;color:#49323d}.result-box button{margin-top:14px}.game-status-live{font-size:20px!important}.current-caption{text-align:center;color:#88737d;font-size:12px;margin-top:-4px;min-height:18px}.rank-card{margin-top:0}
    @media(max-width:700px){.player-head-row{align-items:center;gap:4px}.player-head-row button{width:100%}.meta-line{gap:4px;margin-top:3px}.meta-chip{font-size:11px;padding:3px 6px}.current-call-card{padding:6px 8px!important;margin-bottom:4px!important;border-radius:16px!important}.current-call-card .status{margin:4px 0 2px!important;font-size:18px!important;line-height:1.2}.current-call-card .number{line-height:1!important;min-height:0!important;margin:0!important}.number img{width:min(70px,20vw);height:min(70px,20vw)}.current-farm-image{width:min(70px,20vw)!important;height:min(70px,20vw)!important;margin:0 auto!important}.current-call-card .current-caption{min-height:0!important;height:0!important;margin:0!important;overflow:hidden}.current-call-card + .card{margin-top:0!important;padding-top:7px!important}.copy-row{margin-top:6px!important}}
  </style>
</head>
<body class="cute-theme player-page">
<div class="top"><h1>🌱 種菜賓果</h1><button class="lobby-btn" onclick="goLobby()">🏠 返回遊戲大廳</button></div>
<div class="wrap">
  <div class="card current-call-card">
    <div class="player-head-row"><b>👤 <span id="who"></span>　🏠 房間 <span id="roomText"></span></b><button id="voiceBtn" type="button">🔊 聲音</button></div>
    <div class="meta-line"><span id="startTimeText" class="meta-chip">🕐 開賽時間：讀取中…</span><span id="goalText" class="meta-chip">🏆 完成條件：讀取中…</span></div>
    <div id="gameStatus" class="status game-status-live">重新連線中…</div>
    <div id="currentNumber" class="number">-</div><div id="currentCaption" class="current-caption"></div>
  </div>
  <div class="card"><div id="board" class="board"></div><div class="copy-row"><button class="purple" id="copyBtn" type="button">📋 複製賓果盤（整盤）</button></div><p id="copyHint" class="muted" style="text-align:center"></p></div>
  <div class="card rank-card"><h2>🏆 即時排行榜</h2><table class="leader"><thead><tr><th>排名</th><th>玩家</th><th>點擊格數</th><th>賓果線</th><th>完成時間</th></tr></thead><tbody id="rankBody"></tbody></table></div>
</div>
<div id="resultModal" class="result-modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-box"><h2 id="resultTitle">🏁 本局結束</h2><div id="resultSummary" class="result-big"></div><button id="closeResultBtn" type="button">知道了</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const saved=JSON.parse(sessionStorage.getItem('bingoPlayer')||localStorage.getItem('bingoPlayer')||'null');
if(!saved){alert('請先從玩家加入頁進入房間');location.href='/';throw new Error('No player session')}
const socket=io(); const $=id=>document.getElementById(id); const who=$('who'),roomText=$('roomText'),voiceBtn=$('voiceBtn'),startTimeText=$('startTimeText'),goalText=$('goalText'),gameStatus=$('gameStatus'),currentNumber=$('currentNumber'),currentCaption=$('currentCaption'),board=$('board'),copyBtn=$('copyBtn'),copyHint=$('copyHint'),rankBody=$('rankBody'),resultModal=$('resultModal'),resultSummary=$('resultSummary');
who.textContent=saved.name;roomText.textContent=saved.roomId;
let voiceOn=false,voiceUnlocked=false,current=null,currentToken=0,countdownTimer=null,gameTimer=null,boardNumbers=[],hitNumbers=new Set(),drawnNumbers=new Set(),gameVersion='number',gameItems=[],roomState={};
const imageCache=new Map();
function preloadGameImages(){if(!imageVersion())return;for(const item of gameItems){const src=itemSrc(item);if(imageCache.has(src))continue;const img=new Image();img.decoding='async';img.src=src;imageCache.set(src,img)}}
function goLobby(){location.href='https://game-lobby-eo8o.onrender.com/'}
function imageVersion(v=gameVersion){return v==='farm'||v==='picture'}
function itemSrc(item){return gameVersion==='farm'?`/farm/${item.file}`:`/mahjong/${item.file}`}
function boardStorageKey(){return `bingoBoard:v21.12:${saved.roomId}:${saved.clientId}:${gameVersion}`}
function saveBoardState(size){localStorage.setItem(boardStorageKey(),JSON.stringify({size,numbers:boardNumbers,hits:[...hitNumbers]}))}
function loadBoardState(size){const raw=localStorage.getItem(boardStorageKey())||sessionStorage.getItem(boardStorageKey());if(raw){try{const d=JSON.parse(raw);if(d.size===size&&Array.isArray(d.numbers)){boardNumbers=d.numbers;hitNumbers=new Set(d.hits||[]);return}}catch(e){}}const max=({25:50,36:60,49:75,64:90})[size]||size;boardNumbers=imageVersion()?gameItems.map(x=>x.id):Array.from({length:max},(_,i)=>i+1);for(let i=boardNumbers.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[boardNumbers[i],boardNumbers[j]]=[boardNumbers[j],boardNumbers[i]]}boardNumbers=boardNumbers.slice(0,size);hitNumbers=new Set();saveBoardState(size)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function itemHTML(item,currentItem=false){if(!item)return '';const cls=gameVersion==='farm'?'farm-tile-image':'mahjong-tile-image';const extra=currentItem&&gameVersion==='picture'?' current-mahjong-image':currentItem&&gameVersion==='farm'?' current-farm-image':'';return `<img class="${cls}${extra}" src="${itemSrc(item)}" alt="${esc(item.name||item.face||'')}" draggable="false">`}
function renderBoard(size){loadBoardState(size);const side=Math.sqrt(size);board.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;board.dataset.side=String(side);board.dataset.version=gameVersion;board.innerHTML='';for(const n of boardNumbers){const cell=document.createElement('div');cell.className='cell'+(hitNumbers.has(n)?' hit':'')+(imageVersion()?' picture-cell':'');cell.dataset.number=n;if(imageVersion()){const item=gameItems.find(x=>String(x.id)===String(n));cell.innerHTML=item?itemHTML(item):n}else cell.textContent=n;cell.addEventListener('click',()=>clickCell(cell,n));board.appendChild(cell)}allowCurrent(current)}
function stats(){const cells=[...board.children],side=Math.sqrt(saved.size),marked=cells.map(c=>c.classList.contains('hit'));let lines=0;for(let r=0;r<side;r++)if(Array.from({length:side},(_,c)=>marked[r*side+c]).every(Boolean))lines++;for(let c=0;c<side;c++)if(Array.from({length:side},(_,r)=>marked[r*side+c]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>marked[i*side+i]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>marked[i*side+(side-1-i)]).every(Boolean))lines++;return{hitCount:marked.filter(Boolean).length,bingoLines:lines}}
function clickCell(cell,n){if(roomState.phase!=='playing'||String(n)!==String(current)||cell.classList.contains('hit'))return;cell.classList.add('hit');hitNumbers.add(n);saveBoardState(saved.size);allowCurrent();socket.emit('addScore',{...stats(),token:currentToken})}
function allowCurrent(){[...board.children].forEach(c=>{c.dataset.current=roomState.phase==='playing'&&String(c.dataset.number)===String(current)&&!c.classList.contains('hit')?'1':'0'})}
function formatElapsed(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function clearTimers(){clearInterval(countdownTimer);clearInterval(gameTimer)}
function showCountdown(endAt){clearTimers();const update=()=>{const sec=Math.max(0,Math.ceil((endAt-Date.now())/1000));gameStatus.textContent=sec>0?`⏳ 遊戲倒數：${sec} 秒`:'▶ 遊戲開始！';if(sec<=0)clearInterval(countdownTimer)};update();countdownTimer=setInterval(update,250)}
function showGameRemaining(endAt,limited=true){clearTimers();if(!limited||!endAt){gameStatus.textContent='🟢 遊戲進行中｜不限時';return}const update=()=>{const sec=Math.max(0,Math.ceil((endAt-Date.now())/1000));gameStatus.textContent=`🟢 遊戲進行中｜剩餘 ${formatElapsed(sec)}`;if(sec<=0)clearInterval(gameTimer)};update();gameTimer=setInterval(update,250)}
function speechText(value){if(gameVersion==='number')return String(value);const item=gameItems.find(x=>String(x.id)===String(value));if(gameVersion==='farm'){const n=String(item?.face||String(value).replace('farm-',''));return `圖案 ${Number(n)}`}if(!item)return String(value);const digit={'1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'},name=item.name||item.face||value;if(/^[1-9]萬$/.test(name))return digit[name[0]]+'萬';if(/^[1-9]筒$/.test(name))return digit[name[0]]+'筒';if(/^[1-9](條|索)$/.test(name))return digit[name[0]]+'條';return ({'東':'東風','南':'南風','西':'西風','北':'北風','中':'紅中','發':'發財','白':'白板','春':'春花','夏':'夏花','秋':'秋花','冬':'冬花','梅':'梅花','蘭':'蘭花','菊':'菊花','竹':'竹花'})[name]||name}
function speak(value){if(gameVersion==='farm'||!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speechText(value));u.lang='zh-TW';u.rate=gameVersion==='number'?.9:.8;speechSynthesis.speak(u)}
function renderRanking(list){rankBody.innerHTML=(list||[]).map(p=>`<tr><td>${p.rank<4?['🥇','🥈','🥉'][p.rank-1]:p.rank}</td><td>${esc(p.name)}</td><td>${p.hitCount}</td><td>${p.bingoLines}</td><td>${p.finishSeconds!=null?formatElapsed(p.finishSeconds):'—'}</td></tr>`).join('')}
function updateVoiceUI(){if(gameVersion==='farm'){voiceOn=false;if('speechSynthesis'in window)speechSynthesis.cancel();voiceBtn.disabled=true;voiceBtn.style.display='none'}else{voiceBtn.style.display='';voiceBtn.disabled=false;voiceBtn.textContent=voiceOn?'🔊 聲音：開':'🔇 聲音：關'}}
function renderCurrent(value){if(!value){currentNumber.textContent='-';currentCaption.textContent='';return}const item=gameItems.find(x=>String(x.id)===String(value));if(item&&imageVersion()){currentNumber.innerHTML=itemHTML(item,true);currentCaption.textContent=gameVersion==='farm'?'':(item.name||item.face||'')}else{currentNumber.textContent=value;currentCaption.textContent=''}}
voiceBtn.addEventListener('click',()=>{if(gameVersion==='farm')return;if(!voiceUnlocked){alert('🔊 聲音提醒\n\n如果你是從 LINE 內直接開啟遊戲，可能無法正常播放語音。\n若沒有聲音，請使用 Chrome、Safari 等手機瀏覽器開啟遊戲網址。');voiceUnlocked=true}if(!('speechSynthesis'in window)){alert('目前這個瀏覽器不支援語音播放，請改用 Chrome 或 Safari 開啟。');return}voiceOn=!voiceOn;voiceBtn.textContent=voiceOn?'🔊 聲音：開':'🔇 聲音：關';if(voiceOn){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('語音已開啟');u.lang='zh-TW';speechSynthesis.speak(u)}else speechSynthesis.cancel()});
copyBtn.addEventListener('click',async()=>{const side=Math.sqrt(saved.size),cell=side>=7?54:side===6?64:72,pad=20,headerH=55;const canvas=document.createElement('canvas');canvas.width=side*cell+pad*2;canvas.height=side*cell+pad*2+headerH;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff5f8';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#a23866';ctx.font='bold 22px sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('我的賓果盤｜房間 '+saved.roomId,pad,32);const load=src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src});const cells=[...board.children];for(let i=0;i<cells.length;i++){const c=cells[i],col=i%side,row=Math.floor(i/side),x=pad+col*cell,y=headerH+pad+row*cell,inner=cell-8;ctx.fillStyle=c.classList.contains('hit')?'#ff5d9e':'#fff';ctx.fillRect(x+4,y+4,inner,inner);ctx.strokeStyle='#efbfd0';ctx.lineWidth=1;ctx.strokeRect(x+4,y+4,inner,inner);if(imageVersion()){const tile=c.querySelector('img');if(tile?.src){try{const img=await load(tile.src),maxW=inner-8,maxH=inner-8,scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.drawImage(img,x+cell/2-w/2,y+cell/2-h/2,w,h)}catch(e){}}}else{ctx.fillStyle=c.classList.contains('hit')?'#fff':'#49323d';ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.textContent,x+cell/2,y+cell/2)}if(c.classList.contains('hit')){ctx.strokeStyle='#ff2f83';ctx.lineWidth=4;ctx.strokeRect(x+6,y+6,inner-4,inner-4)}}try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copyHint.textContent='✅ 已複製整張賓果盤圖片'}else throw new Error('clipboard unavailable')}catch(e){const link=document.createElement('a');link.download=`bingo-${saved.roomId}.png`;link.href=canvas.toDataURL('image/png');link.click();copyHint.textContent='✅ 此瀏覽器不支援圖片剪貼簿，已改為儲存整張賓果盤圖片'}});
function showResult(){const s=stats();resultSummary.innerHTML=`🔗 連線：${s.bingoLines} 條<br>✅ 點擊：${s.hitCount} 格`;resultModal.classList.remove('hidden')}
$('closeResultBtn').addEventListener('click',()=>resultModal.classList.add('hidden'));
socket.on('joinError',message=>{alert('❌ '+message);location.href='/'});
socket.on('joinSuccess',data=>{Object.assign(roomState,data);saved.size=data.size;gameVersion=data.version||'number';gameItems=data.items||[];updateVoiceUI();drawnNumbers=new Set((data.drawn||[]).map(String));preloadGameImages();sessionStorage.setItem('bingoPlayer',JSON.stringify(saved));localStorage.setItem('bingoPlayer',JSON.stringify(saved));if(data.scheduledAt){startTimeText.textContent='🕐 開賽：'+new Date(data.scheduledAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}else startTimeText.textContent='🕐 開賽：主控手動開始';goalText.textContent='🏆 完成：'+(data.targetLines===99?'全盤':data.targetLines+' 線');renderBoard(data.size);renderCurrent(data.currentNumber);current=data.currentNumber||null;currentToken=data.drawToken||0;if(data.phase==='waiting')gameStatus.textContent=data.scheduledAt?'等待預定開賽時間':'等待主控開始遊戲';else if(data.phase==='countdown'&&data.countdownEndsAt)showCountdown(data.countdownEndsAt);else if(data.phase==='playing'){showGameRemaining(data.gameEndsAt,data.timeLimitEnabled!==false);allowCurrent()}else if(data.phase==='ended'){gameStatus.textContent='🏁 遊戲已結束';showResult()}});
socket.on('countdownStarted',data=>{roomState.phase='countdown';showCountdown(data.countdownEndsAt)});socket.on('gameStarted',data=>{roomState.phase='playing';roomState.gameEndsAt=data.gameEndsAt;roomState.timeLimitEnabled=data.timeLimitEnabled;showGameRemaining(data.gameEndsAt,data.timeLimitEnabled!==false)});socket.on('numberDrawn',data=>{current=data.number;currentToken=data.token;roomState.currentNumber=data.number;drawnNumbers.add(String(data.number));renderCurrent(data.number);allowCurrent();speak(data.number)});socket.on('rankingUpdate',renderRanking);socket.on('roomDeleted',()=>{alert('此房間已由管理員刪除');sessionStorage.removeItem('bingoPlayer');localStorage.removeItem('bingoPlayer');location.href='/'});socket.on('gameEnded',data=>{clearTimers();roomState.phase='ended';current=null;[...board.children].forEach(c=>c.dataset.current='0');renderCurrent(null);gameStatus.textContent='🏁 遊戲結束';if(data.ranking)renderRanking(data.ranking);showResult()});socket.on('connect',()=>socket.emit('joinRoom',{roomId:saved.roomId,name:saved.name,clientId:saved.clientId}));
</script>
</body>
</html>
